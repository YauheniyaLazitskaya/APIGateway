server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/PaycardSystem/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/payment-cards/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/orders/**, /api/items/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**, /api/users/{userId}/payments/**