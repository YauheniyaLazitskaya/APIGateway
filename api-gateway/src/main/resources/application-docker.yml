server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/PaycardSystem/protocol/openid-connect/certs

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8083
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, /api/payment-cards/**

        - id: order-service
          uri: http://order-service:8082
          predicates:
            - Path=/api/orders/**, /api/items/**

        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**, /api/users/{userId}/payments/**